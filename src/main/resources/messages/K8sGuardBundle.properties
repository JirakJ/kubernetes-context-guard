k8sguard.name=Kubernetes Context Guard
k8sguard.description=Displays kubectl context in status bar and guards against production actions

# Status bar
statusbar.no.context=\u26CE No context
statusbar.tooltip.title=Kubernetes Context Guard
statusbar.tooltip.context=Context: {0}
statusbar.tooltip.cluster=Cluster: {0}
statusbar.tooltip.namespace=Namespace: {0}
statusbar.tooltip.environment=Environment: {0}
statusbar.tooltip.confirmation.required=\u26A0\uFE0F Confirmation required for destructive actions

# Notifications
notification.production.title=Production Context Active
notification.production.content=You are now connected to <b>{0}</b> (cluster: {1}, namespace: {2}). Be careful with destructive operations.
notification.welcome.title=Kubernetes Context Guard Active
notification.welcome.content=Your kubectl context is monitored. Production contexts will trigger warnings.

# Guard dialog
guard.dialog.title=\u26A0\uFE0F Production Context Warning
guard.dialog.warning=PRODUCTION CONTEXT ACTIVE
guard.dialog.message=You are about to work on: {0}
guard.dialog.cluster=Cluster: {0}
guard.dialog.namespace=Namespace: {0}
guard.dialog.impact=Destructive operations in this context affect production systems.
guard.dialog.continue=Continue \u2014 I know what I'm doing
guard.dialog.switch=Switch Away

# Settings
settings.title=Kubernetes Context Guard
settings.enabled=Enable Kubernetes Context Guard
settings.notify.production=Show notification on production context switch
settings.kubeconfig.override=Kubeconfig path override:
settings.kubeconfig.placeholder=~/.kube/config (default)
settings.rules.title=Custom Context Rules (evaluated before defaults)
settings.rules.pattern=Pattern
settings.rules.environment=Environment
settings.rules.confirm=Confirm Actions

# Actions
action.switch.context=Switch Kubernetes Context
action.switch.context.description=Quickly switch kubectl context
action.switch.context.popup.title=Switch Kubernetes Context
action.switch.context.no.contexts=No Kubernetes contexts found. Check your kubeconfig.

# Environments
environment.production=Production
environment.staging=Staging
environment.development=Development
environment.unknown=Unknown
